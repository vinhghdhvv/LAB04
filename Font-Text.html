<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>1.Direction</h1>
    <p style="direction: rtl;">
        Đoạn văn bản ltr (left-to-right)</p>
    <p style="direction: rtl;">
        Đoạn văn bản rtl (right-to-left)</p>
    <h1>2. Text-Shadow</h1>
    <p style="
    background-color: black;
    color: white;
    text-shadow: 2px 2px 3px white;">
        Đoạn text đổ bóng</p>    
    <h1>3. Transform</h1>
    <p style="text-transform: uppercase;">viết hoa</p>
    <p style="text-transform: lowercase;">Viết Thường</p>
    <p style="text-transform: capitalize;">text text</p>
</body> 
</html>
