<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #btn {
            display: block;
            width: 100px;
            height: 50px;
            text-align: center;
            background-color: cornflowerblue;
            color: white;
            border-radius: 20px;
        }
        #btn:hover{
            border: 1px solid cornflowerblue;
            color: cornflowerblue;
            background-color: white;
        }
    </style>
</head>
<body>
    <p id="btn">Hover me!</p>
</body>
</html>
